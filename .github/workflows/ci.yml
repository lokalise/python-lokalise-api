name: CI

on:
  pull_request:

  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    env:
      UV_PYTHON: python
      UV_PYTHON_DOWNLOADS: never

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - name: Sync dependencies
        run: uv sync --group dev --frozen
      - name: Show Python version
        run: |
          python --version
          uv run python --version
      - name: Test
        run: uv run --group dev pytest --cov=lokalise --cov-report=lcov:coverage.lcov
      - name: Upload coverage to Qlty
        if: matrix.python-version == '3.15'
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.lcov

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

      - run: uv sync --group dev --frozen --python python
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run pyright